version: "2"
linters:
  enable:
    - exhaustive
    - forbidigo
    - lll
    - loggercheck
    - misspell
    - revive
    - staticcheck
    - usestdlibvars
  settings:
    misspell:
      # `Conversationable` is a Microsoft Graph SDK type name (groups
      # conversation threads), not a typo of "Conversational".
      ignore-rules:
        - Conversationable
    staticcheck:
      # golangci-lint v2 folds the old `gosimple` linter into `staticcheck`.
      # Keep only the simplify (S*) checks; the SA* analysis checks consume a
      # large amount of memory running against the Graph SDK in this project,
      # causing OOM failures in GitHub Actions (same reason v1 disabled the
      # `staticcheck` linter outright while keeping `gosimple` enabled).
      checks:
        - S*
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: false
      explicit-exhaustive: true
    forbidigo:
      forbid:
        - pattern: context\.(Background|TODO)(# tests should use tester\.NewContext)?
        - pattern: \bpath\.(Ext|Base|Dir|Join)
        - pattern: '[Mm]356(# typo: should be 365)?'
        - pattern: suite\.Suite(# tests should use one of the Suite wrappers in tester package)?
        - pattern: (errors|fmt)\.(New|Stack|Wrap|Error)f?\((# error handling should use clues pkg)?
        - pattern: Warnw?f?\((# logging should use Info or Error)?
        - pattern: (T\(\)|\st[a-zA-Z0-9]*)\.Run(# prefer testify suite.Run(name, func()) )?
        - pattern: 'WithClues(# prefer the builderWC variant - ex: StackWC(ctx, ...))?'
    lll:
      line-length: 120
    revive:
      max-open-files: 2048
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: errorf
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unreachable-code
        - name: use-any
        - name: useless-break
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: exported:.*details.DetailsModel by other packages, and that stutters
      - linters:
          - revive
        text: exported:.*details.DetailsEntry by other packages, and that stutters
      - linters:
          - revive
        text: exported:.*mock.MockModelStore by other packages, and that stutters
      - linters:
          - revive
        text: unexported-return:.*unexported type selectors.exchangeCategory
      - linters:
          - revive
        text: unexported-return:.*unexported type.*kopia.conn
      # Go 1.21 added min/max as builtins and Go 1.20 gave `comparable` builtin
      # meaning for generics; revive only learned to flag shadowing of them in
      # a later release than the one this project used to pin. These helpers
      # predate the builtins and are left as-is rather than refactored to use
      # new language features.
      - linters:
          - revive
        text: 'redefines-builtin-id: redefinition of the built-in (function|type)'
      # Pre-existing naming/receiver patterns unrelated to this chunk; a newer
      # revive release now reports them where the pinned v1 toolchain did not.
      - linters:
          - revive
        path: internal/converters/ics/ics_test.go
        text: 'var-naming:.*cancelledIds'
      - linters:
          - revive
        path: internal/m365/collection/exchange/backup_test.go
        text: modifies-value-receiver
      - linters:
          - revive
        path: _test\.go
        text: import-shadowing:.*'suite' shadows
      - linters:
          - forbidigo
        path: ^.{4}\.go|.*([^_].{4}|_[^t].{3}|_t[^e].{2}|_te[^s].{1}|_tes[^t])\.go
        text: context.(Background|TODO)
      - linters:
          - lll
        path: internal/m365/collection/drive/collections_test.go
      - linters:
          - lll
        path: internal/m365/collection/drive/collections_tree_test.go
      - linters:
          - errcheck
          - forbidigo
          - lll
          - misspell
          - revive
        path: pkg/services/m365/api/graph/betasdk
      - linters:
          - forbidigo
        path: internal/tester/suite.go
        text: suite.Suite
      - linters:
          - forbidigo
        path: pkg/account
        text: suite.Suite
      - linters:
          - forbidigo
        path: pkg/storage
        text: suite.Suite
      - linters:
          - forbidigo
        path: pkg/repository/loadtest
        text: suite.Suite
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/twyouens/corso)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - pkg/services/m365/api/graph/betasdk
