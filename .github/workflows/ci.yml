name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# cancel currently running jobs if a new version of the branch is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Setup Golang with cache
        uses: ./.github/actions/go-setup-cache
        with:
          go-version-file: src/go.mod

      # Pinned to match WANTED_LINT_VERSION in src/Makefile.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      # make check runs build, lint and unit tests; this is the same target
      # a contributor runs locally before opening a pull request.
      - name: make check
        run: GOWORK=off make check
